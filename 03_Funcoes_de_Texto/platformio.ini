; Projeto 03 - Funções de Texto (Central de Comandos)
; Compilar: ícone ✓ (Build) na barra inferior do PlatformIO
; Simular : F1 > "Wokwi: Start Simulator"  (digite os comandos no Serial Monitor do PlatformIO)

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    marcoschwartz/LiquidCrystal_I2C@^1.1.4

; --- Monitor serial ligado ao SIMULADOR Wokwi ---
; Com o simulador rodando, clique no ícone da tomada (Serial Monitor) do PlatformIO.
; Para usar a PLACA FÍSICA na USB, comente a linha abaixo com ";".
monitor_port = rfc2217://localhost:4000
